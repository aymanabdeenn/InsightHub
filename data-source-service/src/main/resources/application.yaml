spring:
  application:
    name: data-source-service
  data:
    mongodb:
      uri: ${MONGODB_URI}
  config:
    import: optional:configserver:http://localhost:8888


management:
  endpoints:
    web:
      exposure:
        include: env,health

jasypt:
  encryptor:
    password: ${INSIGHTHUB_ENCRYPTION_KEY}

logging:
  level:
    org.springframework.web: DEBUG
    org.springframework.http.converter: DEBUG
    com.ayman: DEBUG