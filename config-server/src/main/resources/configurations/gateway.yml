spring:
  application:
    name: gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        -id: payment-service
        uri: http://localhost:8070
        predicates:
          - Path=/api/v1/payments/**

server:
  port: 8222

eureka:
  client:
    register-with-eureka: false


